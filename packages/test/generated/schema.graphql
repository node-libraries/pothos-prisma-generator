type User {
  id: ID!
  email: String!
  name: String!
  posts(filter: PostFilter, orderBy: [PostOrderBy!], cursor: PostUniqueFilter, distinct: [PostDistinctEnum!], limit: Int, offset: Int): [Post!]!
  postsCount(filter: PostFilter): Int!
  roles: [Role!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Post {
  id: ID!
  published: Boolean!
  title: String!
  content: String!
  author: User
  authorId: String
  categories(filter: CategoryFilter, orderBy: [CategoryOrderBy!], cursor: CategoryUniqueFilter, distinct: [CategoryDistinctEnum!], limit: Int, offset: Int): [Category!]!
  categoriesCount(filter: CategoryFilter): Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  publishedAt: DateTime!
}

type Category {
  id: ID!
  name: String!
  posts(filter: PostFilter, orderBy: [PostOrderBy!], cursor: PostUniqueFilter, distinct: [PostDistinctEnum!], limit: Int, offset: Int): [Post!]!
  postsCount(filter: PostFilter): Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TypeTest {
  id: ID!
  scalarList: [String!]!
  role: Role!
}

type Query {
  countUser(filter: UserFilter): Int!
  countPost(filter: PostFilter): Int!
  countCategory(filter: CategoryFilter): Int!
  countTypeTest(filter: TypeTestFilter): Int!
  findUniqueUser(filter: UserUniqueFilter!): User!
  findUniquePost(filter: PostUniqueFilter!): Post!
  findUniqueCategory(filter: CategoryUniqueFilter!): Category!
  findUniqueTypeTest(filter: TypeTestUniqueFilter!): TypeTest!
  findFirstUser(filter: UserFilter, orderBy: [UserOrderBy!], cursor: UserUniqueFilter, distinct: [UserDistinctEnum!]): User
  findFirstPost(filter: PostFilter, orderBy: [PostOrderBy!], cursor: PostUniqueFilter, distinct: [PostDistinctEnum!]): Post
  findFirstCategory(filter: CategoryFilter, orderBy: [CategoryOrderBy!], cursor: CategoryUniqueFilter, distinct: [CategoryDistinctEnum!]): Category
  findFirstTypeTest(filter: TypeTestFilter, orderBy: [TypeTestOrderBy!], cursor: TypeTestUniqueFilter, distinct: [TypeTestDistinctEnum!]): TypeTest
  findManyUser(filter: UserFilter, orderBy: [UserOrderBy!], cursor: UserUniqueFilter, distinct: [UserDistinctEnum!], limit: Int, offset: Int): [User!]!
  findManyPost(filter: PostFilter, orderBy: [PostOrderBy!], cursor: PostUniqueFilter, distinct: [PostDistinctEnum!], limit: Int, offset: Int): [Post!]!
  findManyCategory(filter: CategoryFilter, orderBy: [CategoryOrderBy!], cursor: CategoryUniqueFilter, distinct: [CategoryDistinctEnum!], limit: Int, offset: Int): [Category!]!
  findManyTypeTest(filter: TypeTestFilter, orderBy: [TypeTestOrderBy!], cursor: TypeTestUniqueFilter, distinct: [TypeTestDistinctEnum!], limit: Int, offset: Int): [TypeTest!]!
}

type Mutation {
  createOneUser(input: UserCreateInput!): User!
  createOnePost(input: PostCreateInput!): Post!
  createOneCategory(input: CategoryCreateInput!): Category!
  createOneTypeTest(input: TypeTestCreateInput!): TypeTest!
  createManyUser(input: [UserCreateManyInput!]!): Int!
  createManyPost(input: [PostCreateManyInput!]!): Int!
  createManyCategory(input: [CategoryCreateManyInput!]!): Int!
  createManyTypeTest(input: [TypeTestCreateManyInput!]!): Int!
  updateOneUser(where: UserUniqueFilter!, data: UserUpdateInput!): User!
  updateOnePost(where: PostUniqueFilter!, data: PostUpdateInput!): Post!
  updateOneCategory(where: CategoryUniqueFilter!, data: CategoryUpdateInput!): Category!
  updateOneTypeTest(where: TypeTestUniqueFilter!, data: TypeTestUpdateInput!): TypeTest!
  updateManyUser(where: UserFilter!, data: UserUpdateInput!): Int!
  updateManyPost(where: PostFilter!, data: PostUpdateInput!): Int!
  updateManyCategory(where: CategoryFilter!, data: CategoryUpdateInput!): Int!
  updateManyTypeTest(where: TypeTestFilter!, data: TypeTestUpdateInput!): Int!
  deleteOneUser(where: UserUniqueFilter!): User!
  deleteOnePost(where: PostUniqueFilter!): Post!
  deleteOneCategory(where: CategoryUniqueFilter!): Category!
  deleteOneTypeTest(where: TypeTestUniqueFilter!): TypeTest!
  deleteManyUser(where: UserFilter!): Int!
  deleteManyPost(where: PostFilter!): Int!
  deleteManyCategory(where: CategoryFilter!): Int!
  deleteManyTypeTest(where: TypeTestFilter!): Int!
  upsertOneUser(where: UserUniqueFilter!, create: UserCreateInput!, update: UserUpdateInput!): User!
  upsertOnePost(where: PostUniqueFilter!, create: PostCreateInput!, update: PostUpdateInput!): Post!
  upsertOneCategory(where: CategoryUniqueFilter!, create: CategoryCreateInput!, update: CategoryUpdateInput!): Category!
  upsertOneTypeTest(where: TypeTestUniqueFilter!, create: TypeTestCreateInput!, update: TypeTestUpdateInput!): TypeTest!
}