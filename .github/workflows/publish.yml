name: Publish to npm

on:
  push:
    branches:
      - master
    paths:
      - "packages/pothos-prisma-generator/package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version against npm
        id: check
        run: |
          VERSION=$(node -p "require('./packages/pothos-prisma-generator/package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          NPM_VERSION=$(npm view "pothos-prisma-generator@${VERSION}" version 2>/dev/null || true)
          if [ -n "${NPM_VERSION}" ]; then
            echo "Version ${VERSION} is already published on npm. Skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${VERSION} is not published yet. Proceeding to publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  test-and-build:
    name: Test and Build
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install latest npm and pnpm
        run: npm -g install npm@latest pnpm

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@/test" run prisma:generate

      - name: Run build
        run: pnpm build

      - name: Initialize DB & Run tests
        run: |
          npm run --prefix packages/test test:reset
          npm run --prefix packages/test test:actions

  publish:
    name: Publish to npm & Create Release
    needs: [check-version, test-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install latest npm and pnpm
        run: npm -g install npm@latest pnpm

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@/test" run prisma:generate

      - name: Run build
        run: pnpm build

      - name: Publish to npm (OIDC Provenance)
        run: |
          cd packages/pothos-prisma-generator
          npm publish --provenance --access public

      - name: Create Git Tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${TAG}" -m "Release ${TAG}"
          git push --force origin "${TAG}"
          gh release create "${TAG}" --title "${TAG}" --generate-notes || gh release edit "${TAG}" --title "${TAG}" --generate-notes
